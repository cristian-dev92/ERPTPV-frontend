
<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Hola, PUTO</h1>
      <p>Tonto el que lo lea 🎉</p>
    </div>

<router-outlet />

  @if (uiService.toast(); as t) {
    <div class="toast-flotante" [className]="'toast-flotante ' + t.tipo">
      @if (t.tipo === 'success') { <span>✅</span> }
      @if (t.tipo === 'error') { <span>❌</span> }
      @if (t.tipo === 'warning') { <span>⚠️</span> }
      <p>{{ t.texto }}</p>
    </div>
  }
