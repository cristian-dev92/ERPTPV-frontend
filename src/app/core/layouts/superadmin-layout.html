<div class="app-layout" [class.sidebar-closed]="sidebarColapsado()">
  
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">🚀</span>
      @if (!sidebarColapsado()) {
        <span class="logo-text">Core SaaS Panel</span>
      }
    </div>

    <nav class="sidebar-menu">
      <ul>
        @for (item of menuItems; track item.ruta) {
          <li>
            <a [routerLink]="item.ruta" routerLinkActive="active" class="menu-link">
              <span class="icon">{{ item.icono }}</span>
              @if (!sidebarColapsado()) {
                <span class="label">{{ item.etiqueta }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <button class="btn-toggle" (click)="alternarSidebar()">
        ☰
      </button>

      <div class="header-right-zone">
        <div class="header-user">
          <span class="user-badge">SuperAdmin</span>
          <span class="user-name">Cristian</span>
        </div>

        <button class="btn-logout" (click)="ejecutarLogout()" title="Cerrar Sesión">
          <span class="icon">🚪</span> Salir
        </button>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
